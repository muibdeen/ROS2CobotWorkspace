controller_manager:
  ros__parameters:
    update_rate: 60  # Must match your policy and physics step rate

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    position_controller:
      type: position_controllers/JointGroupPositionController



joint_state_broadcaster:
  ros__parameters:
    interfaces:
      - position
      - velocity
      - effort
position_controller:
  ros__parameters:
    joints:
      - joint2_to_joint1
      - joint3_to_joint2
      - joint4_to_joint3
      - joint5_to_joint4
      - joint6_to_joint5
      - joint6output_to_joint6
